## Configuration file for a typical i2pd user
## See https://i2pd.readthedocs.io/en/latest/user-guide/configuration/
## for more options you can use in this file.

log = file
# Keep runtime logs beside this configuration; the launcher uses this
# directory as i2pd's data directory, so the log is project-local state.
logfile = ./i2pd.log
loglevel = error

# Enable these router transports independently of the local browser proxy.
# IPv6 support here does not change the loopback-only HTTP/SOCKS listeners.
ipv4 = true
ipv6 = true

## Bandwidth profile. L = 32 KB/s, O = 256 KB/s, P = 2048 KB/s,
## X = unlimited. P matches the I2P (Java) backend configuration.
bandwidth = P

[precomputation]
# ElGamal precomputation is disabled; do not change without checking the
# selected router's compatibility and resource tradeoffs.
elgamal = false

[upnp]
# UPnP may request an inbound mapping from the local gateway. This is
# separate from the loopback-only browser proxy and router console binds.
enabled = true
name = I2Pd

[reseed]
# Require reseed data verification; weakening this affects bootstrap trust.
verify = true

[http]
# Bind the administrative web console to loopback so it is not LAN-exposed.
enabled = true
address = 127.0.0.1
port = 7070

[httpproxy]
# Firefox uses this loopback proxy. The outproxy handles destinations outside
# I2P through an I2P exit; it is not a direct browser-to-clearnet connection.
enabled = true
address = 127.0.0.1
port = 4444
outproxy = http://5d4s7pcvfdpftfk7npc7hllyujhufsdprtrf4o53i44rgsa2xbwa.b32.i2p

[socksproxy]
# This optional local SOCKS endpoint is not used by the bundled Firefox policy.
enabled = true
address = 127.0.0.1
port = 4447

[sam]
# SAM is a local client API and is not used by the browser bundle.
enabled = true
address = 127.0.0.1
port = 7656

[addressbook]
# These are I2P address-book sources, fetched through router networking.
defaulturl = http://shx5vqsw7usdaunyzr2qmes2fq37oumybpudrd4jjj4e4vk4uusa.b32.i2p/export/hosts-all.txt
subscriptions = http://i2p-projekt.i2p/hosts.txt,http://skank.i2p/hosts.txt,http://notbob.i2p/hosts-all.txt,http://identiguy.i2p/hosts.txt,http://stats.i2p/cgi-bin/newhosts.txt
