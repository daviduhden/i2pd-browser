name: Agent and skills maintenance

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-agent-maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check synchronization coverage and instruction structure
        run: >-
          python3 scripts/validate-agent-maintenance.py
          --base "${{ github.event.pull_request.base.sha }}"
