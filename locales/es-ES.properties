usage.commands=Comandos:\n  install      Selecciona el router I2P y prepara el navegador (predeterminado).\n  configure    Cambia el router I2P y el idioma seleccionados.\n  start        Inicia el router I2P seleccionado.\n  stop         Detiene el router iniciado por I2Pd Browser.\n  restart      Reinicia el router iniciado por I2Pd Browser.\n  status       Muestra el router seleccionado y su estado.\n  console      Abre la consola del router seleccionado.\n  detect       Enumera los backends de router I2P detectados.
usage.options=Opciones:\n  --language=LANG      Usa en-US, es-ES, ru o zh-CN.\n  --i2p-router=NAME     Selecciona el backend: i2pd o i2p-java.\n  --router-source=SRC   Usa archivos de router system o vendored.\n  --non-interactive     No pregunta; usa valores guardados o predeterminados.\n  --no-browser          No construye Firefox ESR.\n  --no-start            No inicia el router tras install/configure.\n  --install-deps        Instala los paquetes de router que falten.\n  --no-install-deps     No instala paquetes de router (predeterminado).\n  -h, --help            Muestra esta ayuda.
