usage.commands=Команды:\n  install      Выбрать I2P-маршрутизатор и подготовить браузер (по умолчанию).\n  configure    Изменить выбранные I2P-маршрутизатор и язык.\n  start        Запустить выбранный I2P-маршрутизатор.\n  stop         Остановить маршрутизатор, запущенный I2Pd Browser.\n  restart      Перезапустить маршрутизатор, запущенный I2Pd Browser.\n  status       Показать выбранный маршрутизатор и его состояние.\n  console      Открыть консоль выбранного маршрутизатора.\n  detect       Показать найденные реализации I2P-маршрутизатора.
usage.options=Параметры:\n  --language=LANG      Использовать en-US, es-ES, ru или zh-CN.\n  --i2p-router=NAME     Выбрать реализацию: i2pd или i2p-java.\n  --router-source=SRC   Использовать system или vendored файлы маршрутизатора.\n  --non-interactive     Не задавать вопросов; использовать сохранённые значения.\n  --no-browser          Не собирать Firefox ESR.\n  --no-start            Не запускать маршрутизатор после install/configure.\n  --install-deps        Установить отсутствующие пакеты маршрутизатора.\n  --no-install-deps     Не устанавливать пакеты маршрутизатора (по умолчанию).\n  -h, --help            Показать эту справку.
