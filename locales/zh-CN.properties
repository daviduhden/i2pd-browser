usage.commands=命令：\n  install      选择 I2P 路由器并准备浏览器（默认）。\n  configure    更改所选 I2P 路由器和语言。\n  start        启动所选 I2P 路由器。\n  stop         停止由 I2Pd Browser 启动的路由器。\n  restart      重启由 I2Pd Browser 启动的路由器。\n  status       显示所选路由器及其状态。\n  console      打开所选路由器的控制台。\n  detect       列出检测到的 I2P 路由器后端。
usage.options=选项：\n  --language=LANG      使用 en-US、es-ES、ru 或 zh-CN。\n  --i2p-router=NAME     选择后端：i2pd 或 i2p-java。\n  --router-source=SRC   使用 system 或 vendored 路由器文件。\n  --non-interactive     不提示；使用已保存或默认值。\n  --no-browser          不构建 Firefox ESR。\n  --no-start            install/configure 后不启动路由器。\n  --install-deps        安装缺少的路由器软件包。\n  --no-install-deps     不安装路由器软件包（默认）。\n  -h, --help            显示此帮助。
