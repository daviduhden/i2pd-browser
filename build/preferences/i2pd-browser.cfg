// ---------------------------------------------------------
//  ---------- I2Pd Browser Preferences --------------------
// ---------------------------------------------------------
// See the LICENSE file at the top of the project tree for
// copyright and license details.
// This AutoConfig file is loaded by defaults/pref/autoconfig.js. `lockPref`
// prevents user changes, `defaultPref` sets a mutable starting value, and
// `pref` sets a preference without locking it. Do not treat all three as
// equally enforced privacy controls.
// ---------------------------------------------------------

// ---------------------------------------------------------
// ---------- Core / updates / studies ---------------------
// ---------------------------------------------------------
// Keep in-browser updates and remote studies disabled; bundle updates are
// delivered through the project build process rather than Firefox's updater.
lockPref("accessibility.force_disabled", 1);

lockPref("app.normandy.enabled", false);
lockPref("app.normandy.api_url", "");
lockPref("app.shield.optoutstudies.enabled", false);

lockPref("app.update.auto", false);
lockPref("app.update.service.enabled", false);
lockPref("app.update.BITS.enabled", false);
lockPref("app.update.interval", 0);

pref("breakpad.reportURL", "");

// ---------------------------------------------------------
// ---------- First run / general UI -----------------------
// ---------------------------------------------------------
// Reduce first-run and discovery surfaces. Values declared with defaultPref
// remain user-overridable unless an enterprise policy also locks them.
lockPref("browser.aboutwelcome.enabled", false);
lockPref("browser.discovery.enabled", false);

defaultPref("browser.cache.disk.capacity", 131072);

lockPref("browser.contentblocking.category", "strict");

defaultPref("browser.download.useDownloadDir", false);
defaultPref("browser.fixup.fallback-to-https", false);

defaultPref("browser.formfill.enable", false);
defaultPref("browser.formfill.expire_days", 0);

lockPref(
  "browser.uiCustomization.state",
  "{\"placements\":{\"widget-overflow-fixed-list\":[],\"unified-extensions-area\":[],\"nav-bar\":[\"back-button\",\"forward-button\",\"stop-reload-button\",\"customizableui-special-spring1\",\"urlbar-container\",\"customizableui-special-spring2\",\"downloads-button\",\"fxa-toolbar-menu-button\",\"unified-extensions-button\",\"_73a6fe31-595d-460b-a920-fcc0f8843232_-browser-action\"],\"toolbar-menubar\":[\"menubar-items\"],\"TabsToolbar\":[\"tabbrowser-tabs\",\"new-tab-button\",\"alltabs-button\"],\"vertical-tabs\":[],\"PersonalToolbar\":[\"personal-bookmarks\"]},\"seen\":[],\"dirtyAreaCache\":[\"nav-bar\"],\"currentVersion\":22,\"newElementCount\":0}"
);

// ---------------------------------------------------------
// ---------- New Tab / Activity Stream --------------------
// ---------------------------------------------------------
// Disable Activity Stream discovery, sponsored content, telemetry, and weather
// components; these controls do not replace enterprise telemetry policies.
lockPref("browser.newtabpage.activity-stream.discoverystream.enabled", false);
lockPref("browser.newtabpage.activity-stream.feeds.topsites", false);

lockPref("browser.newtabpage.activity-stream.showSponsored", false);
lockPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
lockPref("browser.newtabpage.activity-stream.telemetry", false);

lockPref("browser.newtabpage.activity-stream.showWeather", false);
lockPref("browser.newtabpage.activity-stream.system.showWeather", false);

// ---------------------------------------------------------
// ---------- URL bar / search -----------------------------
// ---------------------------------------------------------
// Avoid query suggestions and speculative host connections from the URL bar.

defaultPref("browser.search.region", "US");
defaultPref("browser.search.update", false);
defaultPref("browser.search.suggest.enabled", false);

lockPref("browser.urlbar.quicksuggest.enabled", false);
lockPref("browser.urlbar.suggest.quicksuggest.nonsponsored", false);
lockPref("browser.urlbar.suggest.quicksuggest.sponsored", false);
lockPref("browser.urlbar.trending.featureGate", false);

lockPref("browser.urlbar.suggest.weather", false);
defaultPref("browser.urlbar.speculativeConnect.enabled", false);

defaultPref("browser.urlbar.dnsResolveSingleWordsAfterSearch", 0);
defaultPref("browser.urlbar.maxRichResults", 12);

// ---------------------------------------------------------
// ---------- Startup --------------------------------------
// ---------------------------------------------------------
// Start at the I2P homepage; the installer's enterprise policy also supplies
// the first-run destination, so keep those URLs aligned.
pref("browser.startup.homepage", "http://i2pd.i2p/");
defaultPref("browser.startup.homepage_override.mstone", "ignore");

defaultPref("browser.tabs.closeWindowWithLastTab", false);
lockPref("browser.tabs.crashReporting.sendReport", false);

// ---------------------------------------------------------
// ---------- HTTPS-First (DISABLED for I2P) ----------------
// ---------------------------------------------------------
// HTTP is required by many .i2p destinations. Enabling upgrades here can make
// those destinations fail even though the proxy itself is configured.
defaultPref("dom.security.https_first", false);
defaultPref("dom.security.https_first_pbm", false);
// Schemeless HTTPS-First (new in ESR 153) must also be off, otherwise
// a bare .i2p host typed in the address bar is upgraded to https://.
defaultPref("dom.security.https_first_schemeless", false);

// ---------------------------------------------------------
// ---------- Networking / speculative ---------------------
// ---------------------------------------------------------
// Suppress prefetch and speculative HTTP connections so typed or linked
// destinations are not contacted ahead of an explicit navigation.
defaultPref("network.prefetch-next", false);
defaultPref("network.http.speculative-parallel-limit", 0);

// ---------------------------------------------------------
// ---------- Permissions / sensitive APIs -----------------
// ---------------------------------------------------------
// Reduce access to device, background, and media APIs. Several permission
// defaults are user-overridable; inspect the declaration type before relying
// on them as a mandatory restriction.
defaultPref("geo.enabled", false);

defaultPref("media.peerconnection.enabled", false);
lockPref("media.navigator.enabled", false);
lockPref("media.getusermedia.screensharing.enabled", false);
lockPref("media.eme.enabled", false);
lockPref("media.gmp-provider.enabled", false);
lockPref("media.gmp-widevinecdm.enabled", false);
defaultPref("media.webspeech.recognition.enable", false);
defaultPref("media.webspeech.synth.enabled", false);

lockPref("beacon.enabled", false);
lockPref("dom.battery.enabled", false);
lockPref("dom.gamepad.enabled", false);
lockPref("dom.netinfo.enabled", false);
lockPref("dom.push.enabled", false);
lockPref("dom.push.connection.enabled", false);
lockPref("dom.push.serverURL", "");
lockPref("dom.serviceWorkers.enabled", false);
lockPref("dom.vibrator.enabled", false);
lockPref("dom.webnotifications.enabled", false);
lockPref("javascript.options.wasm", false);

defaultPref("pdfjs.enableScripting", false);
lockPref("pdfjs.disabled", true);

defaultPref("permissions.default.camera", 2);
defaultPref("permissions.default.microphone", 2);
defaultPref("permissions.default.geo", 2);
defaultPref("permissions.default.desktop-notification", 2);

defaultPref("signon.autofillForms", false);
defaultPref("signon.formlessCapture.enabled", false);

// ---------------------------------------------------------
// ---------- Networking / I2Pd proxy ----------------------
// ---------------------------------------------------------
// The build rewrites the enterprise policy's template endpoint to the
// selected router HTTP proxy. These preferences keep Firefox in manual
// proxy mode and disable direct fallback; preserve both controls together.
defaultPref("network.IDN_show_punycode", true);

lockPref("network.captive-portal-service.enabled", false);
lockPref("network.connectivity-service.enabled", false);

defaultPref("network.dns.disableIPv6", true);
defaultPref("network.dns.disablePrefetch", true);
defaultPref("network.dns.disablePrefetchFromHTTPS", true);

lockPref("network.proxy.type", 1);
// Never fall back to a direct connection when the I2P proxy fails,
// otherwise traffic could leak outside I2P.
lockPref("network.proxy.failover_direct", false);
defaultPref("network.proxy.share_proxy_settings", true);
defaultPref("network.proxy.socks_remote_dns", true);

defaultPref("network.trr.mode", 5);

// ---------------------------------------------------------
// ---------- Security / TLS -------------------------------
// ---------------------------------------------------------
// Disable TLS early data to avoid replayable 0-RTT application data. The
// certificate-error preference below is a user-overridable UI behavior.
defaultPref("security.tls.enable_0rtt_data", false);
defaultPref("browser.xul.error_pages.expert_bad_cert", true);

// ---------------------------------------------------------
// ---------- Telemetry ------------------------------------
// ---------------------------------------------------------
// Disable Firefox telemetry collection and ping submission at preference
// level as an additional layer alongside enterprise policy.
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("toolkit.telemetry.archive.enabled", false);
lockPref("toolkit.telemetry.shutdownPingSender.enabled", false);
lockPref("toolkit.telemetry.firstShutdownPing.enabled", false);
lockPref("toolkit.telemetry.newProfilePing.enabled", false);
lockPref("toolkit.telemetry.updatePing.enabled", false);
lockPref("toolkit.telemetry.server", "");

// ---------------------------------------------------------
// ---------- WebGL / fingerprinting -----------------------
// ---------------------------------------------------------
// Disable WebGL and reduce exposed renderer capability details; these settings
// may affect site compatibility and are defaults rather than locked policies.
defaultPref("webgl.disabled", true);
defaultPref("webgl.enable-debug-renderer-info", false);
defaultPref("webgl.min_capability_mode", true);

// ---------------------------------------------------------
// ---------- UI -------------------------------------------
// ---------------------------------------------------------
// Enable container UI and set stable toolbar defaults for the bundled profile.
defaultPref("privacy.userContext.enabled", true);
defaultPref("privacy.userContext.ui.enabled", true);

lockPref("browser.tabs.inTitlebar", 0);
lockPref("browser.toolbars.bookmarks.visibility", "always");

// ---------------------------------------------------------
// ---------- Sanitize on shutdown -------------------------
// ---------------------------------------------------------
// Clear selected browsing data at shutdown. The browser profile itself is
// persistent and is intentionally preserved by rebuilds.
defaultPref("privacy.sanitize.sanitizeOnShutdown", true);
defaultPref("privacy.clearOnShutdown_v2.cache", true);
defaultPref("privacy.clearOnShutdown_v2.cookiesAndStorage", true);
defaultPref("privacy.clearOnShutdown_v2.historyFormDataAndDownloads", true);

// ---------------------------------------------------------
// ---------- AI / ML (also enforced by AIControls) --------
// ---------------------------------------------------------
// Disable the listed built-in AI features. The enterprise policy is a second
// control where the installed Firefox ESR recognizes that policy.
lockPref("browser.ml.chat.enabled", false);
lockPref("browser.ml.chat.menu", false);
lockPref("browser.ml.chat.sidebar", false);
lockPref("browser.ml.chat.page", false);
lockPref("browser.ml.chat.page.menuBadge", false);
lockPref("browser.ml.chat.page.footerBadge", false);
lockPref("browser.ml.chat.shortcuts", false);
lockPref("browser.ml.chat.shortcuts.custom", false);
lockPref("browser.tabs.groups.smart.enabled", false);
lockPref("sidebar.notification.badge.aichat", false);
